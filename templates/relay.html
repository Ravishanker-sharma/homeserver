<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Gate | Relay Node</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="background-globes">
        <div class="globe globe-1"></div>
        <div class="globe globe-2"></div>
    </div>

    <!-- PASSCODE SECURITY GATE OVERLAY -->
    <div class="auth-overlay" id="auth-overlay" style="display: {% if authenticated %}none{% else %}flex{% endif %};">
        <div class="auth-card">
            <div class="auth-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <h2>Nexus Gate Access</h2>
            <p>Enter security passcode to unlock node 6969</p>
            
            <form id="auth-form" class="auth-form">
                <div class="input-group">
                    <input type="password" id="passcode-input" placeholder="Passcode..." required autofocus autocomplete="off">
                </div>
                <div class="auth-error" id="auth-error" style="display: none;">Invalid security passcode</div>
                <button type="submit" class="btn-primary btn-block">
                    Unlock Gate
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN PORTAL DASHBOARD (PORT 6969) -->
    <div class="app-container" id="portal-content" style="display: {% if authenticated %}block{% else %}none{% endif %};">
        <header class="app-header">
            <div class="brand-container">
                <div class="brand-icon relay-brand-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="2" y1="12" x2="22" y2="12"></line>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="brand-title">Nexus Gate</h1>
                    <p class="brand-subtitle">High-Speed Data Relay & Asset Processor</p>
                </div>
            </div>

            <div class="header-actions">
                <button class="btn-secondary" id="btn-logout">Lock Gate</button>
            </div>
        </header>

        <!-- LINK RESOLVER PANEL -->
        <section class="storage-card relay-input-card">
            <div class="relay-card-header">
                <h3>Asset URL Processor</h3>
                <p>Paste any resource link to resolve direct streamable / downloadable payload URLs.</p>
            </div>

            <form id="resolve-form" class="relay-form">
                <div class="relay-input-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                    </svg>
                    <input type="url" id="target-url" placeholder="https://..." required autocomplete="off">
                    <button type="submit" class="btn-primary" id="btn-fetch">
                        <span id="btn-text">Process Link</span>
                        <span id="btn-spinner" class="spinner" style="display: none;"></span>
                    </button>
                </div>
            </form>
        </section>

        <!-- RESOLVED ASSET RESULT CONTAINER -->
        <section class="relay-result-section" id="result-container" style="display: none;">
            <div class="storage-card">
                <div class="result-header">
                    <div class="result-icon" id="result-icon">📄</div>
                    <div>
                        <h3 id="result-filename">Extracted Asset</h3>
                        <span class="file-size-tag" id="result-filesize">-- MB</span>
                    </div>
                </div>

                <!-- Media Preview Area -->
                <div class="relay-preview-area" id="preview-area" style="display: none;">
                    <video id="relay-video-player" controls style="width: 100%; display: none;"></video>
                    <audio id="relay-audio-player" controls style="width: 100%; display: none;"></audio>
                    <img id="relay-image-preview" src="" style="max-width: 100%; display: none; margin: 0 auto; border-radius: 8px;">
                </div>

                <!-- Action Controls -->
                <div class="result-actions">
                    <a href="#" id="result-download-btn" class="btn-primary" target="_blank" download>
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        Direct Download
                    </a>
                    <button class="btn-secondary" id="btn-copy-payload">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        Copy Direct URL
                    </button>
                </div>
            </div>
        </section>
    </div>

    <!-- TOAST NOTIFICATIONS -->
    <div class="toast-container" id="toast-container"></div>

    <script src="{{ url_for('static', filename='js/relay.js') }}"></script>
</body>
</html>
